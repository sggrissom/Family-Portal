<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>Family Record - Track Your Family's Growth & Milestones</title>
    <meta
      name="description"
      content="A private family portal to track children's growth, milestones, and memories. Share photos, record measurements, and celebrate achievements together."
    />
    <meta name="author" content="Family Record" />
    <meta
      name="keywords"
      content="family, children, growth tracking, milestones, photos, memories, parenting"
    />

    <!--
      Default to not being indexed at all. Every route in this application is
      served the same HTML, so whatever is written here is what a crawler sees
      on /settings and /profile/3 as much as on the landing page. main.tsx
      relaxes this to "index, follow" for the handful of pages that are
      genuinely public, and rewrites the canonical link to match the route.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://familyrecord.app/" />

    <!-- Open Graph Meta Tags for Social Sharing -->
    <meta property="og:title" content="Family Record - Track Your Family's Growth & Milestones" />
    <meta
      property="og:description"
      content="A private family portal to track children's growth, milestones, and memories."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://familyrecord.app/" />
    <meta property="og:site_name" content="Family Record" />
    <meta property="og:locale" content="en_US" />
    <!-- Scrapers do not resolve relative URLs; this has to be absolute. -->
    <meta property="og:image" content="https://familyrecord.app/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Family Record — a private place for your family's growth, milestones, and photos."
    />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Family Record - Track Your Family's Growth & Milestones" />
    <meta
      name="twitter:description"
      content="A private family portal to track children's growth, milestones, and memories."
    />
    <meta name="twitter:image" content="https://familyrecord.app/images/og-image.png" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Family Record" />

    <!-- Links -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />

    <!-- inline critical.css -->
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --text: #1f2937;
        --hero: #111827;
        --muted: #4b5563;
        --border: #e5e7eb;
        --control-border: #848d9a;
        --hover-bg: rgba(0, 0, 0, 0.08);
        --accent: #047857;
        --primary-accent: #065f46;
        --button-text: #ffffff;
        --accent-hover: #036347;
        --primary-accent-hover: #054c38;
        --active-bg: rgba(0, 0, 0, 0.08);
        --active-text: #000;
        --height-color: #3b82f6;
        --weight-color: #ef4444;
        --fs-1: 28px;
        --fs-2: 18px;
        --fs-base: 16px;
        --transition-speed: 0.5s;
      }
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body>
    <script src="/main.tsx" type="module"></script>
  </body>
</html>
