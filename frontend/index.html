<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>Family Record - Track Your Family's Growth & Milestones</title>
    <meta
      name="description"
      content="A private family portal to track children's growth, milestones, and precious memories. Share photos, record height/weight progress, and celebrate achievements together."
    />
    <meta name="author" content="Family Record" />
    <meta
      name="keywords"
      content="family, children, growth tracking, milestones, photos, memories, parenting"
    />
    <meta name="robots" content="nofollow" />
    <link rel="canonical" href="https://familyrecord.app" />

    <!-- Open Graph Meta Tags for Social Sharing -->
    <meta property="og:title" content="Family Record - Track Your Family's Growth & Milestones" />
    <meta
      property="og:description"
      content="A private family portal to track children's growth, milestones, and precious memories."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="Family Record" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Family Record - Track Your Family's Growth & Milestones" />
    <meta
      name="twitter:description"
      content="A private family portal to track children's growth, milestones, and precious memories."
    />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Family Record" />

    <!-- Links -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />

    <!-- inline critical.css -->
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --text: #1f2937;
        --hero: #111827;
        --muted: #4b5563;
        --border: #e5e7eb;
        /*
          Form controls need a boundary a person can actually see: WCAG 1.4.11
          asks 3:1 for a border that says where a control is, and --border is
          1.13:1 against the page. It stays as it is for decorative separators,
          where nothing is being communicated, and controls use this instead.
        */
        --control-border: #848d9a;
        --hover-bg: rgba(0, 0, 0, 0.08);
        /*
          The greens are deeper than the brand colour they started from
          (#10b981 / #059669). White on that gradient was 2.5:1, so the label on
          every primary button in the light theme was unreadable to anyone who
          needed contrast, and the same green as text on the page was 2.3:1.
          These pass 4.5:1 both ways round. The dark theme was already fine and
          is unchanged; #10b981 survives as the browser theme colour and in the
          icon, where nothing has to be read off it.
        */
        --accent: #047857;
        --primary-accent: #065f46;
        --button-text: #ffffff;
        --accent-hover: #036347;
        --primary-accent-hover: #054c38;
        --active-bg: rgba(0, 0, 0, 0.08);
        --active-text: #000;
        --height-color: #3b82f6;
        --weight-color: #ef4444;
        --fs-1: 28px;
        --fs-2: 18px;
        --fs-base: 16px;
        --transition-speed: 0.5s;
      }
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body>
    <script src="/main.tsx" type="module"></script>
  </body>
</html>
